name: Deploy

# main に入ったものを本番へ出す。手動でも回せるようにしておく
# （デプロイだけやり直したい、という場面が必ずある）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは並べて走らせない。後から入った方を待たせ、追い越しを防ぐ。
# CI と違って cancel-in-progress は付けない —— 途中で切ると、
# マイグレーションだけ当たってデプロイされていない状態になりうる。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # テストもビルドも crates/render の wasm を焼いてから走る。
      - run: rustup target add wasm32-unknown-unknown

      # 本番に出す前に、PR で通ったのと同じ検査をもう一度通す。
      # main へは直接 push もできるので、PR の緑だけには頼らない。
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test

      # スキーマを先に当てる。新しい列を使うコードが先に出ると、
      # 反映までの数秒がそのまま 500 になる。
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply sokkuri-crayons-auth --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
