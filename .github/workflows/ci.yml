name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへ続けて push したら、古い実行は捨てる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # `astro check` は先に `astro sync` を走らせて .astro/types.d.ts を作る。
      # アダプタは読み込まれるが、Cloudflare への接続は要らない。
      - run: bun run typecheck

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # 歪みの実装は crates/render の wasm。`bun run test` が焼くので
      # ターゲットだけ足す（Rust 本体はランナーに入っている）。
      - run: rustup target add wasm32-unknown-unknown
      # テストは workerd の中で走る。D1 も R2 も Miniflare のローカル実装なので、
      # Cloudflare のアカウントや API トークンは要らない。
      - run: bun run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # webServer が走らせる `bun run build` が crates/render の wasm を焼く。
      - run: rustup target add wasm32-unknown-unknown
      # ブラウザは Chromium だけ。落書きの検証に必要なのはそこまでで、
      # 増やすと得るものより実行時間の方が伸びる。
      - run: bunx playwright install --with-deps chromium
      # 秘密鍵が無いとアプリが起動しない。E2E は毎回使い捨てで構わない。
      - run: printf 'BETTER_AUTH_SECRET="%s"\n' "$(openssl rand -base64 32)" > .dev.vars
      # ビルドとサーバの起動は playwright.config.ts の webServer が面倒を見る。
      # ここでも Cloudflare のアカウントは要らない（すべて Miniflare のローカル実装）。
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        # 落ちたときだけ。トレースと動画が入っているので、その場で追える。
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
